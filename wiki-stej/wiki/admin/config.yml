backend:
  name: github
  repo: stejproject/wikis       # <-- GANTI: contoh budi/wiki-saya
  branch: main
  commit_messages:
    create: 'Buat halaman "{{slug}}"'
    update: 'Sunting halaman "{{slug}}"'
    delete: 'Hapus halaman "{{slug}}"'
    uploadMedia: 'Unggah "{{path}}"'
    deleteMedia: 'Hapus "{{path}}"'

locale: id
site_url: ../
display_url: ../
media_folder: uploads
public_folder: uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: _

collections:
  - name: pages
    label: Halaman
    label_singular: Halaman
    folder: content
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: categories, label: Kategori, widget: list, required: false, hint: 'Satu kategori per baris' }
      - { name: body, label: Isi, widget: markdown, hint: 'Tautan antar halaman: [[Judul Halaman]] atau [[Judul Halaman|teks tampil]]' }
