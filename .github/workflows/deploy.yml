name: Deploy wiki ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu riwayat git untuk "Perubahan terbaru"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.js
      - run: |
          ls -la index.json || { echo "::error::index.json tidak dibuat oleh build-index.js"; ls -la; exit 1; }
      - run: |
          mkdir -p _site
          touch .nojekyll
          cp index.json _site/
          for f in index.html .nojekyll; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          for d in admin content uploads; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Tunggu artifact terdaftar
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
