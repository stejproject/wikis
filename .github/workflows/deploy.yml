name: Deploy wiki ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu riwayat git untuk "Perubahan terbaru"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.js
      - run: |
          mkdir -p _site
          touch .nojekyll
          # Repo ini hanya menerbitkan artikel + CMS; mesin wiki ada di stejproject.github.io/posts/category/wiki/
          for f in index.html index.json .nojekyll; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          for d in admin content uploads; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
